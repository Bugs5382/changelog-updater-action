name: 'Changelog Updater Action'
description: 'Fast changelog updates using pre-compiled Go binaries'
branding:
  icon: 'book-open'
  color: 'yellow'

author: Shane Froebel <sfroebel@therabbithole.com>

inputs:
  tag:
    required: true
    description: Version of the release, e.g. v1.2.0. Written as the header of the changelog entry; an existing entry with the same version is replaced.
  notes:
    required: false
    description: The release notes you want to add to your CHANGELOG. Required unless changelog-body is set.
  changelog-body:
    required: false
    description: Manual changelog body written verbatim under the version header. When set it overrides notes and skips automatic generation. Use it as an escape hatch to set or repair a release when the drafted notes are empty or wrong.
  path:
    required: false
    description: Directory that holds CHANGELOG.md, relative to the repository root. Defaults to the repository root.
  date:
    required: false
    description: Date written in the version header, e.g. 2026-01-31. Defaults to the current date (UTC).
  diff:
    required: false
    description: Show the diff during the action for debugging purposes.
    default: "false"
  dry:
    required: false
    description: Dry run. Parse and log without writing the changelog.
    default: "false"
  verbose:
    required: false
    description: Log at debug level.
    default: "false"

runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - --tag=${{ inputs.tag }}
    - --notes=${{ inputs.notes }}
    - --changelog-body=${{ inputs.changelog-body }}
    - >-
      --path=/github/workspace/${{ inputs.path }}
    - --date=${{ inputs.date }}
    - --diff=${{ inputs.diff }}
    - --dry=${{ inputs.dry }}
    - --verbose=${{ inputs.verbose }}